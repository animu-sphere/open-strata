name: Idea or feature request
description: Share an improvement or a problem you would like to solve.
title: "idea: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. A brief description is a good place to begin.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us about the workflow or outcome you want to improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Share a possible approach, example, or alternative if you have one.
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true