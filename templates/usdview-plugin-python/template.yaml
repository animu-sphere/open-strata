schema: openstrata.template/v1alpha1
template:
  id: usdview-plugin-python
  version: 0.1.0
  maturity: skeleton
  # Source lifecycle category. Packaged artifacts use component.kind=host-addon.
  artifact_kind: plugin
plugin_kind: usdview-plugin
variables:
  - name: name
    type: portable-identifier
    required: true
outputs:
  files:
    - openstrata.plugin.yaml
    - CMakeLists.txt
    - README.md
    - .gitignore
    - plugin/plugInfo.json
    - python/{{identCamel}}/__init__.py
    - tests/fixtures/basic.usda
    - openstrata.scaffold.yaml
verification:
  levels: [0, 1, 2, 6]
  assertions: [deterministic-generation, usdview-plugin-registration, package-activation]
compatibility:
  ost: ">=0.23,<1.0"
  openusd: ">=25.05,<27.0"
