schema: openstrata.library/v1alpha1
library:
  id: {{name}}
  version: 0.1.0
cmake:
  package: {{Name}}
  target: {{Name}}::{{name}}
package:
  standalone: true
  aggregate_member: true
package_contract:
  package_name: {{Name}}
  exported_targets: [{{Name}}::{{name}}]
  public_headers: [include/{{name}}/**]
  consumer:
    include: {{name}}/{{name}}.hpp
    symbol: {{Name}}::version
runtime:
  directories: [bin, lib]
