# VFX Reference Platform — Calendar Year 2026
# https://vfxplatform.com/
id: cy2026
source:
  kind: vfx-reference-platform
  status: final

core:
  python: "3.13.x"
  qt: "6.8.x"
  pyside: "6.8.x"
  numpy: "2.3.x"
  boost: "1.88.x"
  imath: "3.2.x"
  openexr: "3.4.x"
  ocio: "2.5.x"
  openvdb: "13.x"
  opensubdiv: "3.7.x"
  alembic: "1.8.x"
  ptex: "2.4.x"
  blosc: "1.21.x"
  tbb: "2022.x"
  cxx_standard: "20"
  gcc: "14.2"
  glibc: "2.28"
  msvc: "19.40"
  msvc_runtime: "14.40"
  apple_clang: "17.x"
  libcxx: "17.x"
  macos_sdk: "15.5"
  macos_deployment_target: "13.0"

openusd:
  schema: 2
  cells:
    - os: linux
      arch: x86_64
      toolchain:
        family: gcc
        provider: system
        version_from: gcc
        cxx_standard_from: cxx_standard
        runtime: { family: glibc, provider: system, version_from: glibc }
      python: { family: cpython, provider: platform, version_from: python }
      tbb: { family: onetbb, provider: platform, version_from: tbb }
      variants:
        - id: core
          builders: [build-usd, cmake]
          capabilities: [usd-core]
        - id: gl
          builders: [build-usd, cmake]
          capabilities: [usd-core, imaging, opengl]
        - id: vulkan
          builders: [build-usd, cmake]
          capabilities: [usd-core, imaging, opengl, vulkan]
    - os: windows
      arch: x86_64
      toolchain:
        family: msvc
        provider: visual-studio
        version_from: msvc
        cxx_standard_from: cxx_standard
        runtime: { family: msvc-runtime, provider: visual-studio, version_from: msvc_runtime }
      python: { family: cpython, provider: platform, version_from: python }
      tbb: { family: onetbb, provider: platform, version_from: tbb }
      variants:
        - { id: core, builders: [build-usd, cmake], capabilities: [usd-core] }
        - { id: gl, builders: [build-usd, cmake], capabilities: [usd-core, imaging, opengl] }
        - { id: vulkan, builders: [build-usd, cmake], capabilities: [usd-core, imaging, opengl, vulkan] }
    - os: macos
      arch: arm64
      toolchain:
        family: apple-clang
        provider: xcode
        version_from: apple_clang
        cxx_standard_from: cxx_standard
        runtime: { family: libcxx, provider: xcode, version_from: libcxx }
      python: { family: cpython, provider: platform, version_from: python }
      tbb: { family: onetbb, provider: platform, version_from: tbb }
      macos:
        sdk: { family: macos-sdk, provider: xcode, version_from: macos_sdk }
        deployment_target_from: macos_deployment_target
      variants:
        - { id: core, builders: [build-usd, cmake], capabilities: [usd-core] }
        - { id: gl, builders: [build-usd, cmake], capabilities: [usd-core, imaging, opengl] }
        - { id: metal, builders: [build-usd, cmake], capabilities: [usd-core, imaging, metal] }

notes: >
  CY2026 moves to Python 3.13 and C++20. OpenUSD 26.05 and 26.08 canonical
  runtimes are produced for Linux x86_64, Windows x86_64, and macOS arm64.
