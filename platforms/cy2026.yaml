# VFX Reference Platform — Calendar Year 2026
# https://vfxplatform.com/
id: cy2026
source:
  kind: vfx-reference-platform
  status: final

core:
  python: "3.13.x"
  qt: "6.8.x"
  pyside: "6.8.x"
  numpy: "2.3.x"
  boost: "1.88.x"
  imath: "3.2.x"
  openexr: "3.4.x"
  ocio: "2.5.x"
  openvdb: "13.x"
  opensubdiv: "3.7.x"
  alembic: "1.8.x"
  ptex: "2.4.x"
  blosc: "1.21.x"
  tbb: "2022.x"
  cxx_standard: "20"
  gcc: "14.2"
  glibc: "2.28"

openusd:
  schema: 1
  cells:
    - os: linux
      arch: x86_64
      toolchain:
        family: gcc
        provider: system
        version_from: gcc
        cxx_standard_from: cxx_standard
        runtime: { family: glibc, provider: system, version_from: glibc }
      python: { family: cpython, provider: platform, version_from: python }
      tbb: { family: onetbb, provider: platform, version_from: tbb }
      variants:
        - id: headless
          builders: [build-usd, cmake]
          build_usd_args: [--no-imaging]
          cmake_args: [-DPXR_BUILD_IMAGING=OFF, -DPXR_BUILD_USD_IMAGING=OFF]
          capabilities: [usd-core]
        - id: standard
          builders: [build-usd, cmake]
          build_usd_args: [--imaging]
          cmake_args: [-DPXR_BUILD_IMAGING=ON, -DPXR_BUILD_USD_IMAGING=ON, -DPXR_ENABLE_VULKAN_SUPPORT=OFF]
          capabilities: [usd-core, imaging, opengl]
        - id: vulkan
          builders: [build-usd, cmake]
          build_usd_args: [--imaging]
          cmake_args: [-DPXR_BUILD_IMAGING=ON, -DPXR_BUILD_USD_IMAGING=ON, -DPXR_ENABLE_VULKAN_SUPPORT=ON]
          capabilities: [usd-core, imaging, opengl, vulkan]

notes: >
  CY2026 moves to Python 3.13, the GCC 14.2 / C++20 toolchain, and NumPy 2.x.
  This is the primary target for the first OpenStrata vertical slice.
